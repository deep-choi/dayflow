  <script>
    (() => {
      try {
        const isLocalDev = ['localhost', '127.0.0.1', '0.0.0.0'].includes(window.location.hostname);
        if (isLocalDev && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations()
            .then((registrations) => registrations.forEach((registration) => registration.unregister()))
            .catch(() => {});
        }
        if (isLocalDev && window.caches) {
          caches.keys()
            .then((keys) => keys.filter((key) => /workbox|lifesync|dayflow|vite-pwa/i.test(key)).forEach((key) => caches.delete(key)))
            .catch(() => {});
        }

        const key = 'dayflow-theme';
        const storedTheme = localStorage.getItem(key) || 'system';
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const resolvedTheme = storedTheme === 'dark' || storedTheme === 'light'
          ? storedTheme
          : prefersDark
            ? 'dark'
            : 'light';
        const themeColor = resolvedTheme === 'dark' ? '#0a0a0a' : '#ffffff';
        document.documentElement.dataset.theme = resolvedTheme;
        document.documentElement.style.colorScheme = resolvedTheme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', themeColor);
      } catch {
        // Ignore boot-time theme setup failures.
      }
    })();
  </script>
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
  <title>Dayflow - AI 일상 관리 대시보드</title>
