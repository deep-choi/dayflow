<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <script>
    (() => {
      try {
        const isLocalDev = ['localhost', '127.0.0.1', '0.0.0.0'].includes(window.location.hostname);
        if (isLocalDev && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations()
            .then((registrations) => registrations.forEach((registration) => registration.unregister()))
            .catch(() => {});
        }
        if (isLocalDev && window.caches) {
          caches.keys()
            .then((keys) => keys.filter((key) => /workbox|lifesync|vite-pwa/i.test(key)).forEach((key) => caches.delete(key)))
            .catch(() => {});
        }

        const key = 'lifesync-ai-theme';
        const storedTheme = localStorage.getItem(key) || 'system';
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const resolvedTheme = storedTheme === 'dark' || storedTheme === 'light'
          ? storedTheme
          : prefersDark
            ? 'dark'
            : 'light';
        const themeColor = resolvedTheme === 'dark' ? '#0a0a0a' : '#ffffff';
        document.documentElement.dataset.theme = resolvedTheme;
        document.documentElement.style.colorScheme = resolvedTheme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', themeColor);
      } catch {
        // Ignore boot-time theme setup failures.
      }
    })();
  </script>
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  <title>LifeSync AI</title>
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: #ffffff;
    }

    ::-webkit-scrollbar {

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #d4d4d4;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a3a3a3;
    }
  </style>
